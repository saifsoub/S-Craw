server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-asset paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API to backend container
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Proxy WebSocket to backend container
    location /ws {
        proxy_pass             http://backend:4000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_read_timeout     86400s;  # keep WS connections alive
        proxy_send_timeout     86400s;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

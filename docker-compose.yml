version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       collab_md
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (REST + WebSocket) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT:               4000
      DB_HOST:            postgres
      DB_PORT:            5432
      DB_NAME:            collab_md
      DB_USER:            postgres
      DB_PASSWORD:        postgres
      JWT_SECRET:         "${JWT_SECRET:-change-me-in-production-jwt-secret-32ch}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change-me-in-production-ref-32ch}"
      CORS_ORIGIN:        "http://localhost:5173"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Vite → nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
